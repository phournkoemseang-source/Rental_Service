# Render Blueprint for the chong-choul backend (Laravel API).
#
# The Dockerfile lives in backend/ and expects `backend/` as its build context,
# so the service must have:
#   - Root directory:    backend
#   - Dockerfile path:   Dockerfile
# (these are the rootDir/dockerfilePath values below)
#
# If you created the service manually in the dashboard, set the same two
# settings under Service -> Settings, then add the env vars under Environment
# (APP_KEY, DB_*, CORS_ALLOWED_ORIGINS, ...).
services:
  - type: web
    name: chong-choul-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/cities
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://chong-choul-backend.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: local
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # Allow both the Firebase frontend and the old domain.
      - key: CORS_ALLOWED_ORIGINS
        value: https://chong-choul.web.app,https://chongchoul.online
      - key: DB_CONNECTION
        value: mysql
      - key: DB_PORT
        value: 3306
      # Set these from your Render managed MySQL connection string
      # (Service -> Environment in the dashboard). They are prompted for at
      # Blueprint creation and ignored on later syncs.
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
